<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand">
      <div class="brand-logo">📄</div>
      <h1>DocApproval</h1>
      <p>Streamline your document workflow with smart approvals</p>
    </div>
    <div class="auth-features">
      <div class="feature-item"><span>✅</span> Fast document approvals</div>
      <div class="feature-item"><span>🔔</span> Real-time notifications</div>
      <div class="feature-item"><span>🔒</span> Secure & role-based access</div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Sign in to your account</p>

      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" [(ngModel)]="email" name="email"
                 required placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="password" name="password"
                 required placeholder="Enter your password">
        </div>

        <button type="submit" [disabled]="isLoading" class="btn btn-primary btn-full">
          {{ isLoading ? '⏳ Signing in...' : 'Sign in →' }}
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a routerLink="/register">Register here</a>
      </p>
    </div>
  </div>
</div>
