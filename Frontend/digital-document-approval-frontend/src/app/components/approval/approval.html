<div class="page-header">
  <h2>✅ Pending Approvals</h2>
  <span *ngIf="pendingApprovals.length > 0" class="count-chip">
    {{ pendingApprovals.length }} pending
  </span>
</div>

<div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
<div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
<div *ngIf="isLoading" class="loading">⏳ Loading approvals...</div>

<div *ngIf="!isLoading && pendingApprovals.length === 0" class="empty-state">
  <div class="empty-icon">🎉</div>
  <p>All caught up! No pending approvals.</p>
</div>

<div *ngIf="!isLoading && pendingApprovals.length > 0" class="approvals-list">
  <div *ngFor="let item of pendingApprovals" class="approval-card">
    <div class="approval-header">
      <div class="doc-icon">📄</div>
      <div class="doc-info">
        <h3>{{ item.document.title }}</h3>
        <p>{{ item.document.description || 'No description provided' }}</p>
      </div>
      <span [class]="'badge ' + item.status.toLowerCase()">{{ item.status }}</span>
    </div>

    <div class="form-group" style="margin-top:16px;">
      <label>Review Comments <span class="req-note">(required for rejection)</span></label>
      <textarea [(ngModel)]="comments[item.document.id]" rows="3"
                placeholder="Add your comments here..."></textarea>
    </div>

    <div class="approval-actions">
      <button (click)="approve(item.document.id)"
              [disabled]="processingId === item.document.id"
              class="btn btn-success">
        ✅ Approve
      </button>
      <button (click)="reject(item.document.id)"
              [disabled]="processingId === item.document.id"
              class="btn btn-danger">
        ❌ Reject
      </button>
    </div>
  </div>
</div>
