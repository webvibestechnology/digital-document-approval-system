<div class="sidebar">
  <span class="sidebar-section-label">Main</span>

  <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link">
    <span class="link-icon">🏠</span> Dashboard
  </a>

  <a routerLink="/documents" routerLinkActive="active" class="sidebar-link">
    <span class="link-icon">📄</span> Documents
  </a>

  <a routerLink="/notifications" routerLinkActive="active" class="sidebar-link">
    <span class="link-icon">🔔</span> Notifications
  </a>

  <a routerLink="/profile" routerLinkActive="active" class="sidebar-link">
    <span class="link-icon">👤</span> My Profile
  </a>

  <span class="sidebar-section-label" *ngIf="isApprover || isAdmin">Workflow</span>

  <a routerLink="/approvals" routerLinkActive="active" class="sidebar-link"
     *ngIf="isApprover || isAdmin">
    <span class="link-icon">✅</span> Approvals
  </a>

  <span class="sidebar-section-label" *ngIf="isAdmin">Admin</span>

  <a routerLink="/admin" routerLinkActive="active" class="sidebar-link"
     *ngIf="isAdmin">
    <span class="link-icon">⚙️</span> User Management
  </a>
</div>
