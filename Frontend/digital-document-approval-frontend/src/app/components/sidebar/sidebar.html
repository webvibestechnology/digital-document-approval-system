<p>sidebar works!</p>
<div class="sidebar" *ngIf="authService.isLoggedIn()">
  <div class="sidebar-menu">
    <ul>
      <ng-container *ngFor="let link of navLinks">
        <li *ngIf="shouldShowLink(link.roles)">
          <a [routerLink]="link.route" routerLinkActive="active-link">
            <span class="menu-icon">{{ link.icon }}</span>
            <span class="menu-label">{{ link.label }}</span>
          </a>
        </li>
      </ng-container>
    </ul>
  </div>
</div>
